Decisions to Keep Simple in V1
	•	One owner per garden
	•	One active generated plan per garden
	•	No collaboration yet
	•	No audit/version history yet
	•	No billing yet
	•	No sensor ingestion yet
	•	No marketplace yet

These are deliberate simplifications, not limitations of the product vision.

⸻

What Success Looks Like After This Phase

ELK Garden is no longer a local prototype.
It becomes:
	•	a real app with users
	•	persistent garden data
	•	generated plans tied to real gardens
	•	task workflow tied to real app state
	•	a foundation for sensors, installs, education, and monetization

⸻

Bigger Product Connection

This phase supports the larger business vision:
	•	helping people lower food costs
	•	helping families build confidence and resilience
	•	teaching practical self-reliance
	•	connecting gardening with cooking, preservation, and systems
	•	creating future services, installs, experiences, and products

ELK Garden is not only software.
It is the beginning of a larger practical living platform.

