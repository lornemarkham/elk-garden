ELK Garden — V1 Architecture Roadmap

Purpose

Move ELK Garden from a strong local prototype into a real app foundation that teaches Lorne core SaaS/product skills:
	•	API design
	•	backend architecture
	•	database modeling
	•	authentication
	•	multi-user app thinking
	•	persistence for real customer data

This phase is not about sensors yet.
It is about building the foundation that makes sensors, automation, notifications, and paid users make sense later.

⸻

Guiding Principles
	•	Build for learning and product quality.
	•	Prefer simple, understandable architecture over cleverness.
	•	Ship in vertical slices.
	•	Keep the UI usable while the backend evolves.
	•	Do not overbuild for scale too early, but do model data cleanly.
	•	Every step should unlock a more real product.

⸻

North Star for This Phase

By the end of this roadmap, ELK Garden should support:
	•	real user accounts
	•	login/logout
	•	one user owning one or more gardens
	•	saved garden draft data in a database
	•	generated plans/tasks stored per user and per garden
	•	frontend reading/writing through backend APIs instead of device-only storage
	•	clear path to future sensor ingestion

⸻

Recommended V1 Stack Direction

This is the recommended learning/product path unless a strong reason appears to change it:

Frontend
	•	Existing React + TypeScript frontend
	•	Keep Tailwind-based UI system already started

Backend
	•	Node.js + TypeScript API
	•	Keep structure simple and explicit
	•	REST is totally fine for this phase

Database
	•	PostgreSQL
	•	Good long-term fit for structured product data

ORM / DB tooling
	•	Prisma
	•	Great for learning, schema clarity, migrations, and product speed

Auth
	•	Start with a proven auth solution, not homemade auth
	•	Goal: login/signup/protected routes/user ownership

Hosting
	•	Defer final infra perfection
	•	Optimize for learning + speed first

⸻

What Not To Build Yet
	•	sensor ingestion
	•	automation rules engine
	•	billing
	•	marketplace
	•	community/competitions
	•	advanced team/collaboration model
	•	deep analytics
	•	push notifications
	•	offline sync complexity

Those are future layers, not tomorrow’s foundation.

⸻

Phase Breakdown

Phase 1 — Architecture Clarity

Goal

Know exactly what the app is becoming before writing backend code.

Deliverables
	•	architecture doc
	•	core domain model
	•	app boundaries
	•	frontend/backend/data flow sketch

Questions to answer
	•	What data belongs to a user?
	•	What data belongs to a garden?
	•	What is editable draft vs generated output?
	•	What should be persisted immediately?
	•	What remains derived/generated?

Output

A simple architecture decision doc covering:
	•	frontend responsibilities
	•	backend responsibilities
	•	database responsibilities
	•	auth boundary
	•	AI generation boundary

⸻

Phase 2 — Core Domain Model

Goal

Design the first real data model.

Core entities to model
	•	User
	•	Garden
	•	Area
	•	Row
	•	Crop
	•	GardenDraft
	•	GeneratedPlan
	•	Task
	•	AreaLog
	•	RowLog

Likely ownership shape
	•	User has many Gardens
	•	Garden has many Areas
	•	Area has many Rows
	•	Garden stores planning context and metadata
	•	GeneratedPlan belongs to a Garden
	•	Tasks belong to a Garden and often reference an Area/Row

Key learning target

Understand how product behavior maps to durable data.

Output
	•	schema draft
	•	entity relationship notes
	•	what is required vs optional for V1

⸻

Phase 3 — Auth + User Foundation

Goal

Turn the app into a real user-owned system.

Deliverables
	•	signup/login/logout
	•	protected app routes
	•	user session handling
	•	per-user data ownership rules

Learning target

Understand:
	•	authentication vs authorization
	•	protected backend endpoints
	•	user-linked records

Scope discipline

Do not over-customize auth UI.
Use a reliable, boring setup.

⸻

Phase 4 — Garden Persistence

Goal

Replace device-only garden draft state with real database-backed data.

Deliverables
	•	create garden
	•	save garden basics
	•	save areas
	•	save rows
	•	save logs/notes
	•	load garden back into frontend

Learning target

Understand full CRUD flow:
	•	frontend form state
	•	API request
	•	validation
	•	DB write
	•	DB read
	•	hydration back into UI

Milestone outcome

A user can log in and come back to their garden later.

⸻

Phase 5 — Generated Plan Persistence

Goal

Store ELK-generated output properly.

Deliverables
	•	run Ask ELK using saved draft data
	•	store returned plan
	•	store generated tasks
	•	load latest generated plan per garden
	•	replace prior generated plan intentionally

Learning target

Understand generated content lifecycle:
	•	source draft
	•	generation request
	•	result storage
	•	replacement/versioning decision

Important product decision

For V1, keep it simple:
	•	one current generated plan per garden
	•	replacing is okay
	•	historical versions can come later

⸻

Phase 6 — Task Completion + Garden Workflow

Goal

Make the product loop real.

Deliverables
	•	mark tasks done
	•	undo task completion
	•	save row planted status
	•	save row/area notes
	•	keep task state tied to user/garden

Learning target

Move from “generated content” to “living app state.”

Milestone outcome

ELK Garden becomes a true working garden companion, not just a plan generator.

⸻

Phase 7 — Sensor-Ready Foundation

Goal

Prepare for cool future hardware work without building it yet.

Deliverables
	•	define future Sensor and SensorReading models
	•	decide how readings attach to garden/area/zone
	•	define ingestion path at a high level

Not yet
	•	no live device integration
	•	no dashboards for readings
	•	no automation

Why this phase matters

You will know exactly where sensor data belongs once you start hardware work.

⸻

Suggested Order for Tomorrow

Block A — Write the architecture doc

Make the product/data flow explicit.

Block B — Design the V1 schema

User, Garden, Area, Row, GeneratedPlan, Task.

Block C — Choose auth approach

Keep it boring and proven.

Block D — Plan the first API routes

Example:
	•	POST /gardens
	•	GET /gardens/:id
	•	PATCH /gardens/:id
	•	POST /gardens/:id/areas
	•	PATCH /rows/:id
	•	POST /gardens/:id/generate-plan
	•	GET /gardens/:id/tasks
	•	PATCH /tasks/:id

Block E — Decide migration path from local state

How current frontend state maps into the real backend model.

⸻

Tomorrow’s Practical Execution Plan

1. Architecture session

Write:
	•	app layers
	•	ownership boundaries
	•	generation flow

2. Data model session

Draft tables/relations.
Keep it simple and explicit.

3. Backend/API session

Choose backend structure and first routes.

4. Auth session

Decide sign-in flow and protected app model.

5. Persistence session

Choose the first slice to implement:
	•	probably user -> garden -> save draft

Do not try to finish all implementation tomorrow.
Tomorrow should produce a clear, executable blueprint.

